<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- CSS Dosyaları -->
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/bootstrap-grid.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Yeni Font Awesome CDN linki -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Var Mısın Yok Musun</title>
  </head>
  <body>
    <!-- OVERLAY - TEKLİF BÖLÜMÜ -->
    <div class="overlay-teklif">
      <div class="container-teklif mx-auto">
        <div class="row">
          <div class="telefon">
            <i class="fa-solid fa-phone fa-10x"></i>
          </div>
          <div class="teklif-goster">
            <div class="row">
              <div class="triangle"></div>
              <div class="teklif-alani"></div>
            </div>
          </div>
        </div>
        <div class="row var-yok teklif-goster mt-2">
          <div class="varim btn btn-danger col-6">VARIM</div>
          <div class="yokum btn btn-success col-6">YOKUM</div>
        </div>
        <div class="yeni-oyun btn btn-success mx-auto mt-3">BİR OYUN DAHA</div>
      </div>
    </div>

    <!-- ANA OYUN ALANI -->
    <div class="container-md">
      <div class="row">
        <!-- PARALAR SOL KANAT -->
        <div class="sol-kanat col-6 col-md-3 order-md-1 order-1">
          <div class="paralar paralar-sol">
            <div odul="1" class="para mavi mt-5">1$</div>
            <div odul="2" class="para mavi">2$</div>
            <div odul="5" class="para mavi">5$</div>
            <div odul="10" class="para mavi">10$</div>
            <div odul="25" class="para mavi">25$</div>
            <div odul="50" class="para mavi">50$</div>
            <div odul="100" class="para mavi">100$</div>
            <div odul="250" class="para mavi">250$</div>
            <div odul="500" class="para mavi">500$</div>
            <div odul="750" class="para mavi">750$</div>
          </div>
        </div>

        <!-- ORTA BÖLÜM -->
        <div class="orta-bolum col-md-6 order-md-2 order-3">
          <div class="card oyunu-baslat talimat">
            <div class="card-header">Oyunu Başlat</div>
            <div class="card-body">
              <p class="card-text">
                "Var mısın yok musun" oynamaya hazır mısın?
              </p>
              <a href="#" class="btn btn-success play-butonu">
                <i class="fa-solid fa-play"></i> Şimdi Oyna
              </a>
            </div>
          </div>
          <div class="kutu-sec talimat">KUTUNU SEÇ</div>
          <div class="kutu-kapak">
            <div class="odul-alani cikan-odul mavi-yazi"></div>
          </div>
          <div class="kutu-govde">
            <div class="buyuk-kutu-no"></div>
          </div>
        </div>

        <!-- PARALAR SAĞ KANAT -->
        <div class="sag-kanat col-6 col-md-3 order-md-3 order-2">
          <div class="paralar paralar-sag ml-auto mt-5">
            <div odul="1000" class="para kirmizi">1,000$</div>
            <div odul="2000" class="para kirmizi">2,000$</div>
            <div odul="5000" class="para kirmizi">5,000$</div>
            <div odul="10000" class="para kirmizi">10,000$</div>
            <div odul="25000" class="para kirmizi">25,000$</div>
            <div odul="35000" class="para kirmizi">35,000$</div>
            <div odul="50000" class="para kirmizi">50,000$</div>
            <div odul="100000" class="para kirmizi">100,000$</div>
            <div odul="250000" class="para kirmizi">250,000$</div>
            <div odul="500000" class="para kirmizi">500,000$</div>
          </div>
        </div>
      </div>

      <!-- KÜÇÜK KUTULAR -->
      <div class="container-kucuk-kutu mx-auto">
        <div class="row mx-auto">
          <div class="kucuk-kutu ilk-kutu" data-num="1">1</div>
          <div class="kucuk-kutu ilk-kutu" data-num="2">2</div>
          <div class="kucuk-kutu ilk-kutu" data-num="3">3</div>
          <div class="kucuk-kutu ilk-kutu" data-num="4">4</div>
          <div class="kucuk-kutu ilk-kutu" data-num="5">5</div>
          <div class="kucuk-kutu ilk-kutu" data-num="6">6</div>
          <div class="kucuk-kutu ilk-kutu" data-num="7">7</div>
          <div class="kucuk-kutu ilk-kutu" data-num="8">8</div>
          <div class="kucuk-kutu ilk-kutu" data-num="9">9</div>
          <div class="kucuk-kutu ilk-kutu" data-num="10">10</div>
        </div>
        <div class="row mx-auto">
          <div class="kucuk-kutu ilk-kutu" data-num="11">11</div>
          <div class="kucuk-kutu ilk-kutu" data-num="12">12</div>
          <div class="kucuk-kutu ilk-kutu" data-num="13">13</div>
          <div class="kucuk-kutu ilk-kutu" data-num="14">14</div>
          <div class="kucuk-kutu ilk-kutu" data-num="15">15</div>
          <div class="kucuk-kutu ilk-kutu" data-num="16">16</div>
          <div class="kucuk-kutu ilk-kutu" data-num="17">17</div>
          <div class="kucuk-kutu ilk-kutu" data-num="18">18</div>
          <div class="kucuk-kutu ilk-kutu" data-num="19">19</div>
          <div class="kucuk-kutu ilk-kutu" data-num="20">20</div>
        </div>
      </div>
    </div>

    <!-- JavaScript Dosyaları -->
    <script src="js/jquery-3.5.0.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
